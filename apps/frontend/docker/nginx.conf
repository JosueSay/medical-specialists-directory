server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras minimas de seguridad para los estaticos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los assets llevan hash en el nombre: se pueden cachear de forma agresiva
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # La API la sirve el backend; el nombre del servicio viene de la red de compose
    location /api/ {
        proxy_pass http://asclepius:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta desconocida devuelve el index
    location / {
        try_files $uri $uri/ /index.html;
    }
}

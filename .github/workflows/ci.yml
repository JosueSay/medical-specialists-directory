name: CI

# Verificacion automatica del trabajo que entra a main (P3-11). No despliega:
# cada deploy a produccion tiene costo real y se ejecuta a mano.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Formato, lint, tipos y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # El emulador de Firestore corre sobre la JVM y firebase-tools exige
      # Java 21 o superior. La imagen de ubuntu-latest trae una version anterior
      # por defecto, de modo que hay que fijarla de forma explicita.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # El backend y el frontend importan @msd/contracts compilado
      - name: Compilar contratos
        run: pnpm run --filter @msd/contracts build

      - name: Formato
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Tipos
        run: pnpm run typecheck

      - name: Pruebas
        run: pnpm run test

      # El adaptador de Firestore no lo cubre ninguna prueba unitaria, porque
      # esas usan el repositorio en memoria. Dos defectos llegaron a produccion
      # por esa via, asi que el emulador corre tambien en CI y no solo cuando
      # alguien se acuerda de levantarlo.
      - name: Pruebas de integracion contra el emulador de Firestore
        run: >
          npx -y firebase-tools@15.25.1 emulators:exec
          --only firestore
          --project msd-integration-tests
          "pnpm run --filter @msd/backend test:integration"

      # Verifica que la funcion sigue empaquetandose: un fallo aqui significa
      # que el despliegue se rompio, no las pruebas
      - name: Empaquetar la Cloud Function
        run: pnpm run --filter @msd/backend bundle
